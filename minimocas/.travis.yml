language: cpp

matrix:
  include:

   - os: osx
     compiler: gcc
     name: macOS - gcc@5
     env:
       - MATRIX_EVAL="brew update && brew install gcc@5 fltk freeglut && brew upgrade cmake && CC=gcc-5 && CXX=g++-5"
       - EXTRA_CMAKE_SETTINGS=""
       - INSTALL_BOOST=""

    - os: osx
      compiler: gcc
      name: macOS - native gcc (llvm backend)
      env:
        - MATRIX_EVAL="brew update && brew install fltk freeglut && brew upgrade cmake"
        - EXTRA_CMAKE_SETTINGS=""
        - INSTALL_BOOST=""

    - os: osx
      compiler: clang
      name: macOS - native clang
      env:
        - MATRIX_EVAL="brew update && brew install fltk freeglut && brew upgrade cmake"
        - EXTRA_CMAKE_SETTINGS=""
        - INSTALL_BOOST=""

    - os: linux
      compiler: clang
      name: ubuntu - native clang
      addons:
        apt:
          update: true
          packages:
            - libc++-dev
            - libfltk1.3-dev
            - freeglut3-dev
            - libgl1-mesa-dev
            - libglu1-mesa-dev
            - libxinerama-dev
            - libjpeg-dev
            - libxi-dev
            - libxmu-dev
            - libsqlite3-dev
      env:
        - MATRIX_EVAL=""
        - EXTRA_CMAKE_SETTINGS="-DFORCE_LLVM_CPP_STDLIB=TRUE -DBOOST_ROOT:PATHNAME=/home/travis/boost -DBoost_NO_BOOST_CMAKE=TRUE"
        - INSTALL_BOOST="./install_boost_clang.sh"

    - os: linux
      compiler: clang
      name: ubuntu - clang@3.6
      addons:
        apt:
          update: true
          packages:
            - clang-3.6
            - libc++-dev
            - libfltk1.3-dev
            - freeglut3-dev
            - libgl1-mesa-dev
            - libglu1-mesa-dev
            - libxinerama-dev
            - libjpeg-dev
            - libxi-dev
            - libxmu-dev
            - libsqlite3-dev
      env:
        - MATRIX_EVAL="CC=clang-3.6 && CXX=clang++-3.6"
        - EXTRA_CMAKE_SETTINGS="-DFORCE_LLVM_CPP_STDLIB=TRUE -DBOOST_ROOT:PATHNAME=/home/travis/boost -DBoost_NO_BOOST_CMAKE=TRUE"
        - INSTALL_BOOST="./install_boost_clang.sh"

    - os: linux
      compiler: clang
      name: ubuntu - clang@3.8
      addons:
        apt:
          update: true
          sources:
            - llvm-toolchain-trusty-3.8
            - ubuntu-toolchain-r-test
