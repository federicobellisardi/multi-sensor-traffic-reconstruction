  allow_failures:
    - name: macOS - gcc@5.0      # fatal error: _stdio.h: No such file or directory
    - name: ubuntu - native gcc
    - name: ubuntu - gcc@4.9


before_install:
  - eval "${MATRIX_EVAL}"
  - git clone https://github.com/physycom/sysconfig.git
  - export WORKSPACE=$(pwd)
  - if [[ "$TRAVIS_OS_NAME" == "linux" ]]; then wget --no-check-certificate https://cmake.org/files/v3.12/cmake-3.12.2-Linux-x86_64.tar.gz       ;fi
  - if [[ "$TRAVIS_OS_NAME" == "linux" ]]; then tar -xzf cmake-3.12.2-Linux-x86_64.tar.gz                                                        ;fi
  - if [[ "$TRAVIS_OS_NAME" == "linux" ]]; then export PATH=$PWD/cmake-3.12.2-Linux-x86_64/bin:$PATH                                             ;fi
  - if [[ "$TRAVIS_OS_NAME" == "linux" && "$CC" == "gcc"* ]]; then mkdir -p latest-gcc-symlinks                                                  ;fi
  - if [[ "$TRAVIS_OS_NAME" == "linux" && "$CC" == "gcc"* ]]; then ln -s /usr/bin/$CXX latest-gcc-symlinks/g++                                   ;fi
  - if [[ "$TRAVIS_OS_NAME" == "linux" && "$CC" == "gcc"* ]]; then ln -s /usr/bin/$CC  latest-gcc-symlinks/gcc                                   ;fi
  - if [[ "$TRAVIS_OS_NAME" == "linux" && "$CC" == "gcc"* ]]; then export PATH=$PWD/latest-gcc-symlinks:$PATH                                    ;fi


install:
  - travis_wait 45 ${INSTALL_BOOST}
  - mkdir build && cd build

script:
  - cmake .. ${EXTRA_CMAKE_SETTINGS} && cmake --build .
