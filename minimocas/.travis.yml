        - EXTRA_CMAKE_SETTINGS="-DFORCE_LLVM_CPP_STDLIB=TRUE -DBOOST_ROOT:PATHNAME=/home/travis/boost -DBoost_NO_BOOST_CMAKE=TRUE"
        - INSTALL_BOOST="./install_boost_clang.sh"

    - os: linux
      compiler: clang
      name: ubuntu - clang@3.9
      addons:
        apt:
          update: true
          sources:
            - llvm-toolchain-trusty-3.9
            - ubuntu-toolchain-r-test
          packages:
            - clang-3.9
            - libc++-dev
            - libfltk1.3-dev
            - freeglut3-dev
            - libgl1-mesa-dev
            - libglu1-mesa-dev
            - libxinerama-dev
            - libjpeg-dev
