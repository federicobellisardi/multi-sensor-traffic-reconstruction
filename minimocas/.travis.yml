       - EXTRA_CMAKE_SETTINGS="-DBOOST_ROOT:PATH=/home/travis/boost -DBOOST_INCLUDEDIR:PATH=/home/travis/boost/include -DBOOST_LIBRARYDIR:PATH=/home/travis/boost/lib -DBoost_NO_BOOST_CMAKE=TRUE"
