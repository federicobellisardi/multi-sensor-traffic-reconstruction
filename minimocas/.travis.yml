            - clang-3.8
            - libc++-dev
            - libfltk1.3-dev
            - freeglut3-dev
            - libgl1-mesa-dev
            - libglu1-mesa-dev
            - libxinerama-dev
            - libjpeg-dev
            - libxi-dev
            - libxmu-dev
            - libsqlite3-dev
      env:
