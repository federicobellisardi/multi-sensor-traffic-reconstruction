upstream mover_us {
    server gui:8000;
}

server {

    listen 80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/ssl/certs/mover-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/mover-selfsigned.key;

    server_name mover.com;

    location / {
        proxy_pass http://mover_us;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /staticfiles/;
    }
}
