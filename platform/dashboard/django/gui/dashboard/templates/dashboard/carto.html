{% extends 'main.html' %}
{% load static %}

{% block title %}
mov-er | cartography
{% endblock title %}

{% block header_script %}
<!-- Bootstrap core JS-->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A==" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA==" crossorigin=""></script>
{% endblock header_script %}

{% block main %}
<div class="container-fluid">
  <h1 class="mt-4">Cartography layer <a href="{% static 'sim_result/carto.geojson' %}" class="btn btn-lg mr-2 btn-success float-right">Download GEOJSON</a></h1>

  <div class="row mt-5 mb-5 d-flex justify-content-center">
    <div id="mapdiv" style="width: 60%; height: 600px;"></div>
  </div>

</div>
{% endblock main %}

{% block script %}

<script src="{% static 'js/scripts.js' %}"></script>

<!-- map plot code -->
<script>
  var southWest = L.latLng(43.748822, 9.201408),
      northEast = L.latLng(45.127953, 12.749101),
      bounds = L.latLngBounds(southWest, northEast);

  var mymap = L.map('mapdiv', {
    center: [45,11],
  });
  mymap.fitBounds(bounds);

  // tile layers
  var sat_tile = new L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Data by \u0026copy; \u003ca href=\"http://openstreetmap.org\"\u003eOpenStreetMap\u003c/a\u003e, under \u003ca href=\"http://www.openstreetmap.org/copyright\"\u003eODbL\u003c/a\u003e.",
      detectRetina: false, "noWrap": false, "opacity": 1, "subdomains": "abc", "tms": false
    }
  );

  var map_tile = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {"attribution": "Data by \u0026copy; \u003ca href=\"http://openstreetmap.org\"\u003eOpenStreetMap\u003c/a\u003e, under \u003ca href=\"http://www.openstreetmap.org/copyright\"\u003eODbL\u003c/a\u003e.", "detectRetina": false, "maxNativeZoom": 18, "maxZoom": 18, "minZoom": 0, "noWrap": false, "opacity": 1, "subdomains": "abc", "tms": false}
  );
  map_tile.addTo(mymap);

  var tile_layers = {
    Satellite:sat_tile,
    OpenStreetMap:map_tile,
  };

  // vector layers
  carto = {{ simres.carto | safe }}

  layers = {}
  vec_layers = {}

  var cartocol = 'red';
  var cartolay = L.layerGroup().addTo(mymap);
  carto.forEach(function (poly, i) {
    var polyline = L.polyline(poly, {color: cartocol, weight:1}).bindPopup('poly ' + i).addTo(cartolay);
  })
  vec_layers['<span style="color:' + cartocol + ';">Road network</span>'] = cartolay

  headers.forEach(function (header, i) {
    var lay = L.layerGroup().addTo(mymap);
    var polyline = L.polyline(shapes[i], {color: colors[i], weight:5}).bindPopup(headers[i]).addTo(lay);
    vec_layers['<span style="color:' + colors[i] + ';">' + header + '</span>'] = lay
  })

  var opt_layers = {
    collapsed: false,
    autoZIndex: false,
  }

  L.control.layers(tile_layers, vec_layers, opt_layers).addTo(mymap);

</script>

{% endblock script %}
